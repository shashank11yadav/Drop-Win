version: 2
updates:
  - package-ecosystem: npm
    # typescript-eslint supports TypeScript < 6.1, so hold TypeScript majors until it catches up.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    directory: /
    cooldown:
      default-days: 3
      semver-major-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
      runtime:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 3
      semver-major-days: 7
    schedule:
      interval: weekly
    # codeql-action init and analyze must stay on the same version, so update actions together.
    groups:
      actions:
        patterns: ['*']
